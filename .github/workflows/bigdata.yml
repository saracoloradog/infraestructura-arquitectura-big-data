name: EA3 - Enriquecimiento de datos

on:
  push:
    paths:
      - "EA3_enriquecimiento_datos/**"
      - ".github/workflows/bigdata.yml"
  workflow_dispatch:

jobs:
  enriquecimiento:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r EA3_enriquecimiento_datos/requirements.txt

      - name: Ejecutar enriquecimiento
        run: python EA3_enriquecimiento_datos/src/enrichment.py

      - name: Publicar evidencias
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-ea3
          path: |
            EA3_enriquecimiento_datos/src/xlsx/enriched_data.xlsx
            EA3_enriquecimiento_datos/src/static/auditoria/enrichment_report.txt
